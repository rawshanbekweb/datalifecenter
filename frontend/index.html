<!doctype html>
<!-- Asosiy til QORAQALPOQCHA (prefikssiz manzil shu tilda); o'zbekcha va
     qolganlari /uz, /ru, /en prefiksi bilan ochiladi va React ilovasi
     <html lang> ni ish paytida almashtiradi.
     Manba: frontend/src/i18n/config.ts -> DEFAULT_LOCALE. -->
<html lang="kaa">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
    <link rel="apple-touch-icon" href="/assets/logotype.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title data-default>DATA LIFE — IT Education Center & Technology Company</title>
    <!--
      Quyidagi teglar — ZAXIRA qiymatlar: JS ishga tushmaguncha va JS
      ishlatmaydigan robotlar uchun shular ko'rinadi.
      data-default belgisi MAJBURIY: React <meta>ni faqat qo'shadi, eskisini
      almashtirmaydi — <Seo> komponenti aynan shu belgiga qarab zaxiralarni
      olib tashlaydi, aks holda sahifada ikkita tavsif qolib, qidiruv tizimi
      umumiy zaxirani tanlardi.
      og:image ATAYIN to'liq manzil bilan — Telegram/Facebook nisbiy yo'lni
      ocholmaydi va rasmsiz preview chiqaradi.
    -->
    <meta name="description" data-default content="DATA LIFE — Nókistegi IT oqıw orayı hám baǵdarlama islep shıǵıw jámááti. Dásturlaw, raqamlı ónimler hám keleshek qánigelerin tayarlaw." />
    <meta property="og:site_name" data-default content="DATA LIFE" />
    <meta property="og:title" data-default content="DATA LIFE — IT Education Center" />
    <meta property="og:description" data-default content="Zamanagóy IT oqıw orayı — keleshekti búgennen jaratıń" />
    <meta property="og:type" data-default content="website" />
    <meta property="og:url" data-default content="https://datalife.uz/" />
    <meta property="og:image" data-default content="https://datalife.uz/assets/logotype.png" />
    <meta property="og:locale" data-default content="uz_UZ" />
    <meta name="twitter:card" data-default content="summary_large_image" />
    <meta name="twitter:title" data-default content="DATA LIFE — IT Education Center" />
    <meta name="twitter:description" data-default content="Zamanagóy IT oqıw orayı — keleshekti búgennen jaratıń" />
    <meta name="twitter:image" data-default content="https://datalife.uz/assets/logotype.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- API backend (Render) — TLS qo'l berishish sahifa yuklanishi bilan parallel boshlanadi -->
    <link rel="preconnect" href="https://datalife.onrender.com" crossorigin />
    <!--
      Variable (wght@a..b) so'rovi: har bir og'irlik uchun alohida woff2 o'rniga
      subset boshiga bitta fayl tushadi.
      Montserrat — Outfit'da kirill glifleri yo'qligi uchun qo'shilgan zaxira
      shrift: brauzer har bir belgi uchun stackdan glif topa oladigan birinchi
      shriftni tanlaydi, shuning uchun lotin matn baribir Outfit'da qoladi va
      Montserrat'ning faqat kirill subset'i (ya'ni faqat ru sahifalarida) yuklanadi.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&family=Montserrat:wght@400..900&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
